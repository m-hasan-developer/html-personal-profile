    <div
      style="
        background-color: #def2c0;
        padding: 20px;
        text-align: center;
        margin-bottom: 20px;
      "
    >
      <h1>Student Registration Form</h1>
    </div>


<div class="StuTable">

<table>
  <tr>
    <td>Full Name:</td>
    <td>
      <input type="text" placeholder="Enter Your Full Name" />
    </td>
  </tr>

  <tr>
    <td>Email:</td>
    <td>
      <input type="email" required placeholder="Enter Your Email" />
    </td>
  </tr>

  <tr>
    <td>Password:</td>
    <td>
      <input type="password" required minlength="5" placeholder="Enter Your Password" />
    </td>
  </tr>

  <tr>
    <td>Contact Number:</td>
    <td>
      <input type="tel" required placeholder="Enter Your Contact Number" />
    </td>
  </tr>

  <tr>
    <td>Gender:</td>
    <td>
      <input type="radio" name="gender" value="male" /> Male
      <input type="radio" name="gender" value="female" /> Female
      <input type="radio" name="gender" value="other" /> Other
    </td>
  </tr>

  <tr>
    <td>Select Course:</td>
    <td>
      <input type="checkbox" name="course" value="html" /> HTML
      <input type="checkbox" name="course" value="css" /> CSS
      <input type="checkbox" name="course" value="js" /> JavaScript
      <input type="checkbox" name="course" value="python" /> Python
    </td>
  </tr>

  <tr>
    <td>Address:</td>
    <td>
      <textarea placeholder="Enter Your Address Here"></textarea>
    </td>
  </tr>
</table>
</div>
