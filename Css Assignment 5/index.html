<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <div class="container">

        <header>
            <nav>
                <!-- Logo -->
                <div class="logo">
                    <img src="https://uakp98.github.io/shoe_store/images/logo.png" alt="logo">
                </div>

                <!-- Right Side: Links Icon -->
                <div class="navRight">
                    <div class="link">
                        <a href="">Home</a>
                        <a href="">Products</a>
                        <a href="">About</a>
                        <a href="">Contact</a>
                        <a href="">Account</a>
                    </div>

                    <i class="bi bi-bag"></i>
                </div>
            </nav>

            <!-- Hero Section -->
            <div class="row">
                <!-- Left: Text -->
                <div class="col-1">
                    <h1>Give your Workout <br> A New Style!</h1>
                    <p>
                        Success isn't always about greatness. It's about consistency.
                        Consistent hard work gains success. Greatness will come.
                    </p>
                    <a href="" class="nowBtn">Explore Now</a>
                </div>

                <!-- Right: Image -->
                <div class="col-2">
                    <img src="https://uakp98.github.io/shoe_store/images/image1.png" alt="shoe">
                </div>
            </div>
        </header>

        <main>
            <div class="box1">

                <div><img src="https://uakp98.github.io/shoe_store/images/category-1.jpg" alt=""></div>
                <div><img src="https://uakp98.github.io/shoe_store/images/category-2.jpg" alt=""></div>
                <div><img src="https://uakp98.github.io/shoe_store/images/category-3%20(2).jpg" alt=""></div>

            </div>
        </main>

    </div>

</body>

</html>
